<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Recuperar contrasena - Sicher</title>
<link rel="stylesheet" href="/static/login.css?v=responsive-20260517"/>
<script src="/config.js"></script>
</head>
<body>
<div class="wrap">
  <div class="shell">
    <div class="logo">
      <h1>Sistema de Seguridad</h1>
    </div>

    <h2>Recuperar contrasena</h2>
    <p class="mut">Ingrese su correo y le enviaremos un enlace para crear una nueva contrasena.</p>
    <div id="msg" class="err"></div>

    <label>Correo</label>
    <input id="email" class="in" placeholder="usuario@vigilia.io" autocomplete="username"/>

    <button id="btn" class="btn mt-14">Enviar enlace</button>

    <div class="foot">
      <a href="/">Volver al inicio de sesion</a>
    </div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const apiUrl = path => (window.sicherApiUrl ? window.sicherApiUrl(path) : path);

function showMessage(text, ok = false) {
  const msg = $('#msg');
  msg.textContent = text;
  msg.classList.toggle('okbox', ok);
  msg.style.display = 'block';
}

async function submitRequest() {
  const email = $('#email').value.trim();
  if (!email) {
    showMessage('Ingrese su correo.');
    return;
  }

  const btn = $('#btn');
  btn.disabled = true;
  try {
    const res = await fetch(apiUrl('/password-reset/request'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email })
    });
    const data = await res.json();
    const error = data.error || data.detail?.error;
    if (!res.ok) {
      showMessage(error || 'No se pudo procesar la solicitud.');
      return;
    }
    showMessage(data.message || 'Si el correo existe, enviaremos un enlace para crear una nueva contrasena.', true);
  } catch (e) {
    showMessage('Error de conexion.');
  } finally {
    btn.disabled = false;
  }
}

$('#btn').onclick = submitRequest;
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') submitRequest();
});
</script>
</body>
</html>
